name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Next version, for example 1.0.6. Leave empty to bump the patch version automatically.'
        required: false
        type: string

run-name: Build Aura AI APK for ${{ github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Android release
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: true

      - name: Prepare release version
        id: metadata
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          if [ -z "$CURRENT_VERSION" ]; then
            echo "::error::Could not read version from pubspec.yaml"
            exit 1
          fi

          CURRENT_NAME="${CURRENT_VERSION%%+*}"
          CURRENT_BUILD="${CURRENT_VERSION##*+}"
          if [ "$CURRENT_BUILD" = "$CURRENT_VERSION" ]; then
            CURRENT_BUILD=0
          fi
          if ! printf '%s' "$CURRENT_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::pubspec.yaml version must look like 1.0.5+5"
            exit 1
          fi
          if ! printf '%s' "$CURRENT_BUILD" | grep -Eq '^[0-9]+$'; then
            echo "::error::pubspec.yaml build number must be numeric"
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "::error::Run this workflow from the main branch"
              exit 1
            fi

            INPUT_VERSION="$(jq -r '.inputs.version // empty' "$GITHUB_EVENT_PATH")"

            if [ -z "$INPUT_VERSION" ]; then
              IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT_NAME"
              NEXT_NAME="${MAJOR}.${MINOR}.$((10#$PATCH + 1))"
              NEXT_BUILD=$((10#$CURRENT_BUILD + 1))
            elif [[ "$INPUT_VERSION" == *"+"* ]]; then
              NEXT_NAME="${INPUT_VERSION%%+*}"
              NEXT_BUILD="${INPUT_VERSION##*+}"
            else
              NEXT_NAME="$INPUT_VERSION"
              NEXT_BUILD=$((10#$CURRENT_BUILD + 1))
            fi

            if ! printf '%s' "$NEXT_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Version must look like 1.0.6 or 1.0.6+6"
              exit 1
            fi
            if ! printf '%s' "$NEXT_BUILD" | grep -Eq '^[0-9]+$'; then
              echo "::error::Build number must be numeric"
              exit 1
            fi

            NEXT_BUILD=$((10#$NEXT_BUILD))
            if [ "$(printf '%s\n%s\n' "$CURRENT_NAME" "$NEXT_NAME" | sort -V | tail -n 1)" != "$NEXT_NAME" ] || [ "$NEXT_NAME" = "$CURRENT_NAME" ]; then
              echo "::error::New version $NEXT_NAME must be greater than current version $CURRENT_NAME"
              exit 1
            fi
            if [ "$NEXT_BUILD" -le $((10#$CURRENT_BUILD)) ]; then
              echo "::error::New build number $NEXT_BUILD must be greater than current build number $CURRENT_BUILD"
              exit 1
            fi

            RELEASE_TAG="v${NEXT_NAME}"
            if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
              echo "::error::Tag $RELEASE_TAG already exists"
              exit 1
            fi

            sed -i "s/^version:.*/version: ${NEXT_NAME}+${NEXT_BUILD}/" pubspec.yaml
            if ! grep -q "^version: ${NEXT_NAME}+${NEXT_BUILD}$" pubspec.yaml; then
              echo "::error::Failed to update pubspec.yaml"
              exit 1
            fi

            BUMP=true
            echo "Next version: ${NEXT_NAME}+${NEXT_BUILD}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
            NEXT_NAME="$CURRENT_NAME"
            NEXT_BUILD="$CURRENT_BUILD"
            BUMP=false
          fi

          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::No release tag was provided"
            exit 1
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "NEXT_VERSION=${NEXT_NAME}+${NEXT_BUILD}" >> "$GITHUB_ENV"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Release tag: $RELEASE_TAG"
          echo "Version bump: $BUMP"

      - name: Validate signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::Release signing is not configured. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD as repository secrets."
            exit 1
          fi

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail

          APP_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          APP_VERSION_NAME="${APP_VERSION%%+*}"
          if [ -z "$APP_VERSION" ] || [ -z "$APP_VERSION_NAME" ]; then
            echo "::error::Could not read version from pubspec.yaml"
            exit 1
          fi

          if [ -z "${RELEASE_TAG:-}" ]; then
            echo "::error::No release tag was provided"
            exit 1
          fi

          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$TAG_VERSION" != "$APP_VERSION_NAME" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match pubspec version $APP_VERSION_NAME"
            exit 1
          fi

          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"
          echo "app_version_name=$APP_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=Aura AI ${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Building Aura AI ${APP_VERSION} for ${RELEASE_TAG}"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/aura-release.jks
          test -s android/app/aura-release.jks

          {
            printf 'storeFile=aura-release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties

          chmod 600 android/key.properties android/app/aura-release.jks
          echo "SIGNED=true" >> "$GITHUB_ENV"
          echo "Using the configured release keystore."

      - name: Build release APK
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64 --no-pub

      - name: Commit version bump
        if: steps.metadata.outputs.bump == 'true'
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore(release): ${NEXT_VERSION}"
          git push origin HEAD:main
          echo "build_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare release files
        env:
          BUILD_SHA: ${{ steps.commit.outputs.build_sha || github.sha }}
        run: |
          set -euo pipefail

          APK_NAME="AuraAI-v${APP_VERSION_NAME}-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"

          SHA256="$(sha256sum "$APK_NAME" | awk '{print $1}')"
          printf '%s  %s\n' "$SHA256" "$APK_NAME" > "$APK_NAME.sha256"

          cat > release_notes.md <<EOF
          ## Aura AI ${APP_VERSION_NAME}

          Android arm64 release APK for Aura AI.

          - Version: ${APP_VERSION}
          - Package: com.orailnoor.privatelm
          - Minimum Android: 9 (API 28)
          - Build commit: ${BUILD_SHA}
          - SHA-256: ${SHA256}
          - Signing: Signed with the configured release keystore.

          Install:
            adb install -r ${APK_NAME}

          The APK and SHA-256 checksum are attached below.
          EOF

          ls -lh "$APK_NAME" release_notes.md

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: AuraAI-${{ steps.version.outputs.app_version_name }}-arm64
          path: |
            AuraAI-v*-arm64.apk
            AuraAI-v*-arm64.apk.sha256
            release_notes.md
          compression-level: 0
          overwrite: true
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.metadata.outputs.release_tag }}
          name: ${{ steps.version.outputs.release_name }}
          target_commitish: ${{ steps.commit.outputs.build_sha || github.sha }}
          body_path: release_notes.md
          files: |
            AuraAI-v*-arm64.apk
            AuraAI-v*-arm64.apk.sha256
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true

      - name: Remove signing material
        if: always()
        run: |
          rm -f android/key.properties android/app/aura-release.jks
